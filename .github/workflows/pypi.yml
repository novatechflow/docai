name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build tomli-w

      - name: Sync version from tag
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          import tomli_w

          pyproject = Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text())
          version = "${{ github.ref_name }}".removeprefix("v")
          data["project"]["version"] = version
          pyproject.write_text(tomli_w.dumps(data), encoding="utf-8")
          print("Set version to", version)
          PY
        shell: bash

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
