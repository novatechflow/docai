[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docai-toolkit"
version = "0.1.3.1"
description = "Local OCR + Markdown + RAG toolkit with optional Hugging Face endpoints."
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Alexander Alten" }
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pypdf>=6.0,<7",
  "reportlab>=4.4,<6",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13,<0.4",
  "pdf2image>=1.17,<2",
]
rag = [
  "langchain>=1.0,<2",
  "langchain-community>=0.4,<1",
  "langchain-text-splitters>=1.0,<2",
  "sentence-transformers>=5.0,<7",
  "faiss-cpu>=1.9,<2",
  "huggingface-hub>=0.34,<2",
]
llm = [
  "transformers>=4.56,<6",
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.42,<1",
]
all = [
  "docai-toolkit[ocr,rag,llm]",
]
dev = [
  "docai-toolkit[ocr,rag,llm]",
  "pytest>=8.0,<10",
]

[project.urls]
Homepage = "https://github.com/2pk03/docai"

[tool.setuptools]
py-modules = ["pdf_viewer_app"]

[tool.setuptools.packages.find]
include = ["docai_toolkit*"]

[project.scripts]
docai-viewer = "pdf_viewer_app:main"
